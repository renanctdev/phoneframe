<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Gravação</title>
  <link rel="stylesheet" href="recbar.css" />
</head>
<body>
  <div class="bar" id="bar" data-state="idle">
    <button class="rec" id="recBtn" title="Gravar vídeo do celular">
      <span class="rec__dot"></span>
      <span class="rec__square"></span>
      <span class="rec__count" id="count"></span>
    </button>
    <div class="timer" id="timer">REC</div>
    <button class="small" id="folderBtn" title="Abrir pasta das gravações">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5Z"/></svg>
    </button>
    <div class="drag" title="Arrastar"></div>
  </div>
  <script type="module" src="recbar.js"></script>
</body>
</html>
