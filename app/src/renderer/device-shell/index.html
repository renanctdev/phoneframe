<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src http: https:; child-src http: https:" />
  <title>PhoneFrame</title>
  <link rel="stylesheet" href="device-shell.css" />
  <script src="../../shared/deviceGeometry.js"></script>
</head>
<body>
  <div class="phone" id="phone">
    <div class="phone__body" id="body">
      <div class="phone__bezel" id="bezel">
        <div class="phone__screen" id="screen">
          <div class="statusbar" id="statusbar">
            <span class="statusbar__time" id="clock">9:41</span>
            <span class="statusbar__icons">
              <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.3-1.4A10.4 10.4 0 0 0 8 .3 10.4 10.4 0 0 0 .7 3.2L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.8c1.3 0 2.5.5 3.4 1.3l1.3-1.4A6.8 6.8 0 0 0 8 4.1 6.8 6.8 0 0 0 3.3 5.9l1.3 1.4C5.5 6.5 6.7 6 8 6Zm0 3.8a1.6 1.6 0 1 0 0 0Zm0-1.9c-.8 0-1.5.3-2 .8L8 11l2-2.3c-.5-.5-1.2-.8-2-.8Z"/></svg>
              <svg viewBox="0 0 27 13" width="25" height="12"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="19" height="9" rx="2"/><path d="M24.5 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2Z" opacity=".5"/></svg>
            </span>
          </div>
          <div class="island" id="island"></div>

          <div class="urlbar">
            <div class="urlbar__pill">
              <svg class="urlbar__icon" viewBox="0 0 16 16" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M2.5 3.5h7M6 2v1.5M4 3.5c.6 2.4 2.3 4.4 4.5 5.5M8 3.5C7.4 6 5.6 8.1 3 9.3M8.5 13.5l2.7-7 2.8 7M9.5 11.5h3.4"/></svg>
              <input id="address" class="urlbar__input" type="text" spellcheck="false" autocomplete="off" />
              <svg class="urlbar__icon" viewBox="0 0 16 16" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M8 10V1.8M5 4.5 8 1.5l3 3M5.5 6.5H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1h-1.5"/></svg>
            </div>
            <div class="progress" id="progress"></div>
          </div>

          <div class="viewport" id="viewport"></div>

          <div class="toolbar">
            <button id="backBtn" title="Voltar" disabled>
              <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 12H4m6-6-6 6 6 6"/></svg>
            </button>
            <button id="forwardBtn" title="Avançar" disabled>
              <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 12h16m-6-6 6 6-6 6"/></svg>
            </button>
            <button id="reloadBtn" title="Recarregar" class="toolbar__primary">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4.5h-4.5"/></svg>
            </button>
            <button id="deviceBtn" title="Mudar aparelho">
              <svg viewBox="0 0 24 24" width="20" height="20"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M10.5 18.5h3"/></svg>
            </button>
            <button id="closeBtn" title="Fechar">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <div class="home-area" id="homeArea"><div class="home-indicator"></div></div>
        </div>
        <div class="home-button" id="homeButton"></div>
      </div>
    </div>
  </div>
  <script src="device-shell.js"></script>
</body>
</html>
