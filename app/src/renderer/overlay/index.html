<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Toque</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
    .touch {
      position: absolute; left: 0; top: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.12s, background 0.08s;
      will-change: transform;
    }
    .touch.pressed { background: rgba(255, 255, 255, 0.6); }
    .ripple {
      position: absolute; left: 0; top: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      animation: ripple 0.45s ease-out forwards;
    }
    @keyframes ripple { from { transform: var(--t) scale(1); opacity: 0.9; } to { transform: var(--t) scale(2.2); opacity: 0; } }
  </style>
</head>
<body>
  <div class="touch" id="touch"></div>
  <script src="overlay.js"></script>
</body>
</html>
